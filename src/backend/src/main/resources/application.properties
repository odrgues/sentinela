# O Render diz a porta na variável PORT; sem ela, 8080.
server.port=${PORT:8080}
spring.application.name=backend

# Banco: os valores depois de ":" são os do docker-compose (desenvolvimento).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/sentinela?useTimezone=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Desativa comandos DDL automáticos do Hibernate: o banco nasce do database/schema/01_ddl.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: em produção, trocar pela variável JWT_SECRET
api.security.token.secret=${JWT_SECRET:4z6V9u8x/A?D(G+KbPeShVmYq3t6w9z$C&F)J@NcQfTjWnZr4u7x!A%D*G-KaPdS}

# Front que pode chamar a API pelo navegador e endereço usado no link de nova senha
app.cors.origens=${FRONT_ORIGENS:http://localhost:5173}
app.front.url=${FRONT_URL:http://localhost:5173}

# E-mail (Gmail com senha de app). Sem MAIL_HOST, o link de nova senha só aparece no log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
