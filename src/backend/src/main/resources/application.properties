# O Render diz a porta na variável PORT; sem ela, 8080.
server.port=${PORT:8080}
spring.application.name=backend

# Banco: os valores depois de ":" são os do docker-compose (desenvolvimento).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Desativa comandos DDL automáticos do Hibernate: o banco nasce do database/schema/01_ddl.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: em produção, trocar pela variável JWT_SECRET
api.security.token.secret=${JWT_SECRET}

# Front que pode chamar a API pelo navegador e endereço usado no link de nova senha
app.cors.origens=${FRONT_ORIGENS:http://localhost:5173}
app.front.url=${FRONT_URL:http://localhost:5173}

# E-mail (Gmail com senha de app). Sem MAIL_HOST, o link de nova senha só aparece no log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# URL da Evolution API (em produção, use a variável EVOLUTION_API_URL; localmente usa a porta 8082)
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8082}
evolution.api.key=${EVOLUTION_API_KEY:}